[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "nuclear-morphometry-evaluation"
version = "0.1.0"
description = "Population-aware evaluation of nuclear segmentation outputs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{name = "Anton Shilov"}]
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "scikit-image==0.26.0"]

[project.scripts]
nucmorph = "nuclear_morphometry.cli:main"

[dependency-groups]
dev = ["ruff==0.16.9", "mypy==1.19.1", "build==1.3.0", "pip-audit==2.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/nuclear_morphometry"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/nuclear_morphometry"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*", "skimage.*"]
ignore_missing_imports = true


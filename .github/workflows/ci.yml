name: CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned environment manager
        run: python -m pip install uv==0.11.19
      - name: Install locked CPU environment
        run: uv sync --locked --group dev
      - name: Run static checks and offline numerical examples
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
          uv run --locked nucmorph demo
          uv run --locked nucmorph reproduce
          uv build --offline --no-config --default-index https://pypi.org/simple
